.toggle .slider:before{content:'';position:absolute;left:3px;top:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.slider{background:#22c55e}

#app{min-height:100vh;background:#f8fafc}

  .sb-hamburger{display:inline-flex;margin-right:10px;background:#f1f5f9;border:none;border-radius:9px;padding:7px 10px;font-size:16px;cursor:pointer}

function H(){ return {'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'} }

async function api(path,opts={}){
  try{
    const r=await fetch(API+path,{...opts,headers:{...H(),...(opts.headers||{})}});
    if(r.status===401){logout();throw new Error('401');}
    if(r.status===423){kilitEkrani();throw new Error('401');}
    const ct=r.headers.get('content-type')||'';
    return ct.includes('json')?r.json():r.text();
  }catch(e){if(e.message!=='401')showToast('Bağlantı hatası: '+path,'err'); throw e;}
}

  _toastTimer=setTimeout(()=>t.classList.remove('show'),3500);

// ── Cloudflare Turnstile (v1.20) — Einstellungen aus Entegrasyonlar ──
// test: offizieller Testschluessel (besteht immer), live: Server prueft per siteverify.
const TS={}, TS_W={};
let _tsSkript=null;
function tsSkript(){
  if(window.turnstile) return Promise.resolve();
  return _tsSkript||(_tsSkript=new Promise((ok,f)=>{ const s=document.createElement('script');
    s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; s.async=true;
    s.onload=()=>ok(); s.onerror=()=>{_tsSkript=null;f();}; document.head.appendChild(s); }));
}
function tsRender(id){
  const c=(GIRIS_CFG||{}).turnstile; TS[id]=null;
  if(!c||!c.aktif||!c.siteKey||!el(id)) return;
  tsSkript().then(()=>{ const box=el(id); if(!box||!window.turnstile) return;
    TS_W[id]=window.turnstile.render(box,{sitekey:c.siteKey,language:'tr',theme:'light',
      callback:t=>{TS[id]=t;}, 'expired-callback':()=>{TS[id]=null;}, 'error-callback':()=>{TS[id]=null;}});
    if(c.mod==='test') box.insertAdjacentHTML('beforeend','<p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:4px">Turnstile test modu</p>');
  }).catch(()=>{});
}
function tsToken(id){ return TS[id]||null; }
function tsReset(id){ TS[id]=null; if(TS_W[id]!=null&&window.turnstile){ try{ window.turnstile.reset(TS_W[id]); }catch{} } }

const KILIT_MS=15*60*1000;

function kilitWaechter(){
  clearInterval(_kilitTimer);
  _kilitTimer=setInterval(()=>{
    if(!TOKEN||KILITLI||!el('view')) return;
    const jetzt=Date.now();
    if(jetzt-_sonAktivite>=KILIT_MS){ kilitle('hareketsizlik'); return; }
    // Herzschlag hoechstens jede Minute, nur wenn der Nutzer wirklich etwas tat
    if(_sonAktivite>_sonHerzschlag&&jetzt-_sonHerzschlag>=60000){
      _sonHerzschlag=jetzt; fetch(API+'/aktivite',{method:'POST',headers:H()}).then(r=>{ if(r.status===423) kilitEkrani(); }).catch(()=>{});
    }
  },15000);
}

async function kilitAc(){

    if(r.ok){ kilitKaldir(); routeAnwenden(); sbSayacLaden(); return; }

// ── Hash-Routing: #/<seite>[/<arg>][?query] — Browser-Zurück bleibt im Admin ──
function aktuelleRoute(){
  const h=location.hash.replace(/^#\/?/,''); const [pfad,qs]=h.split('?');
  const t=(pfad||'').split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x)}catch{return x}});
  let r=t[0]||'dashboard'; const alias=!!ROUTE_ALIAS[r]; if(alias) r=ROUTE_ALIAS[r];
  return {r,arg:t[1]||null,arg2:t[2]||null,q:new URLSearchParams(qs||''),alias};
}
function route(r){ const h='#/'+r; if(location.hash!==h) location.hash=h; else routeAnwenden(); }
function routeAnwenden(){
  if(!el('view')) return;
  const {r,arg,arg2,alias}=aktuelleRoute();
  if(alias) history.replaceState(null,'','#/'+r);
  if(/^(giris|sifremi-unuttum|yeni-sifre)$/.test(r)){ history.replaceState(null,'','#/dashboard'); return routeAnwenden(); }
  renderSidebar();
  const eintrag=sbEintrag(r);
  const t=el('topbar-title'); if(t) t.textContent=PAGE_TITLES[r]||eintrag?.label||r;
  window.scrollTo(0,0);
  if(eintrag?.hazirlaniyor) return vHazirlaniyor(eintrag);
  if(r!=='musteri') akteNeu();
  if(r==='kullanicilar'){ if(arg) return altKundeUmleiten(arg); history.replaceState(null,'','#/musteriler'); return routeAnwenden(); }
  if(r==='musteri'&&arg){ if(!arg2) history.replaceState(null,'','#/musteri/'+encodeURIComponent(arg)+'/zaman'); return vMusteri(arg,arg2||'zaman'); }
  if(r==='musteri') { history.replaceState(null,'','#/musteriler'); return routeAnwenden(); }
  if(r==='musteriler'||r==='bireysel'||r==='kurumsal'){ if(!el('m-tbody')||el('view').dataset.liste!==r){ V(''); el('view').dataset.liste=r; } return vMusteriler(r==='musteriler'?'':r); }
  el('view').dataset.liste='';
  const views={
    dashboard:vDashboard,kyc:vKyc,kurumsalonay:vKurumsalOnay,
    ilanonay:vIlanOnay,riskmesaj:vRiskMesaj,ilanlaryayin:vIlanlarYayin,ilansikayet:vIlanSikayet,degerlendirmeler:vDegerlendirmeler,
    destektickets:vDestekTickets,oneriler:vOneriler,
    abonelikler:vAbonelikler,paketler:vPaketler,kuponlar:vKuponlar,
    vitaminler:vVitaminler,slider:vSlider,kategoriler:vKategoriler,
    waayar:vWaAyar,entegrasyonlar:vEntegrasyonlar,ayarlar:vAyarlar
  };
  (views[r]||vDashboard)();
}

const ADMIN_BASIS=API.replace(/\/api$/,'');
// Inseratsbilder: /uploads/ilanlar/… liefert auch der Admin selbst (LAN :3002 kennt /uploads nicht)
const medya=u=>!u?'':String(u).startsWith('/uploads/ilanlar/')?ADMIN_BASIS+u:String(u).startsWith('arsiv/dosya/')?API+'/'+u:u;
// Kleine Variante (v1.27, Namensregel wie api/src/lib/bild.js kleinUrl) fuer Kacheln und Listen.
// Liefert die Attribute src/srcset/sizes; fehlt _sm, faellt das Bild auf die grosse Datei zurueck.
const kleinUrl=u=>{u=String(u||'');if(!/^\/uploads\/ilanlar\/[^/]+\.webp$/.test(u))return null;if(/_sm\.webp$/.test(u))return u;return /_lg\.webp$/.test(u)?u.replace(/_lg\.webp$/,'_sm.webp'):u.replace(/\.webp$/,'_sm.webp')};
const imgKlein=(u,sizes='120px')=>{const k=kleinUrl(u),g=medya(u);if(!k)return `src="${escH(g)}"`;const ks=medya(k);return `src="${escH(ks)}" srcset="${escH(ks)} 480w, ${escH(g)} 1200w" sizes="${sizes}" onerror="this.onerror=null;this.removeAttribute('srcset');this.src='${escH(g)}'"`};
const noKlasse=(c,tip)=>tip==='kurumsal'?'kur':c==='k'?'k':c==='e'?'e':'n';
function noRozet(no,c,tip,link=true){
  if(!no) return '<span style="color:#94a3b8">—</span>';
  const k=noKlasse(c,tip); const t=tip==='kurumsal'?'Kurumsal':c==='k'?'Bireysel · Kadın':c==='e'?'Bireysel · Erkek':'Cinsiyet belirtilmemiş';
  return link?`<a class="kp-no ${k}" href="#/musteri/${encodeURIComponent(no)}" title="${t} — müşteri dosyası" onclick="event.stopPropagation()">${escH(no)}</a>`:`<span class="kp-no ${k}" title="${t}">${escH(no)}</span>`;
}
const aktifRozet=a=>a?'<span class="kp-aktif"><i></i>AKTİF</span>':'<span class="kp-pasif"><i></i>AKTİF DEĞİL</span>';
const gunFark=d=>d?Math.floor((Date.now()-new Date(d))/864e5):null;
function hesapRozet(u,kalan){
  if(u.durum==='silindi') return `<span class="kp-sil" title="Hesap kapatıldı">⛔ Müşteri ayrıldı${u.silindi_at?' · '+fmtDate(u.silindi_at):''}</span>`;
  if(u.durum==='silme_bekliyor'){ const k=kalan!=null?kalan:Math.max(0,30-(gunFark(u.silinme_istegi)||0)); return `<span class="kp-sil" title="Talep: ${fmtDate(u.silinme_istegi)}">🗑 Silme talebi · ${k} gün kaldı</span>`; }
  if(['askida','banli','banlı','parked'].includes(u.durum)) return `<span class="kp-askida" title="${escH(u.ban_sebebi||'')}">⏸ Askıda</span>`;
  return '';
}
const kAd=u=>u.hesap_tipi==='kurumsal'&&u.firma_adi?u.firma_adi:([u.ad,u.soyad].filter(Boolean).join(' ')||'İsimsiz');
const telGoster=p=>{ const m=String(p||'').match(/^\+90(5\d{2})(\d{3})(\d{2})(\d{2})$/); return m?`+90 ${m[1]} ${m[2]} ${m[3]} ${m[4]}`:(p||'—'); };
const fmtTL=n=>n==null?'—':fmt(Math.round(Number(n)))+' ₺';
const fmtTam=d=>d?new Date(d).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const once=d=>{ const g=gunFark(d); return g==null?'—':g===0?'bugün':g===1?'dün':g+' gün önce'; };

// Kleiner Dialog fuer Begruendungen (statt prompt()). Liefert den Text oder null.
function sebepModal(baslik,aciklama,btn,{zorunlu=true,tehlike=true}={}){
  return new Promise(ok=>{
    const d=document.createElement('div'); d.className='modal-backdrop'; d.id='sebep-modal';
    d.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><p class="section-title" style="margin-bottom:6px">${escH(baslik)}</p>
      <p style="font-size:13px;color:#64748b;margin-bottom:12px;line-height:1.6">${escH(aciklama)}</p>
      <textarea id="sebep-metin" rows="3" placeholder="Sebep…"></textarea><p id="sebep-hata" class="hidden" style="color:#b91c1c;font-size:12.5px;margin-top:6px">Sebep zorunludur.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btn-secondary" id="sebep-iptal">Vazgeç</button>
      <button class="btn ${tehlike?'btn-primary':'btn-success'}" id="sebep-ok">${escH(btn)}</button></div></div>`;
    const kapat=v=>{ d.remove(); document.removeEventListener('keydown',esc); ok(v); };
    const esc=e=>{ if(e.key==='Escape') kapat(null); };
    document.addEventListener('keydown',esc);
    d.addEventListener('click',e=>{ if(e.target===d) kapat(null); });
    document.body.appendChild(d);
    el('sebep-iptal').onclick=()=>kapat(null);
    el('sebep-ok').onclick=()=>{ const v=el('sebep-metin').value.trim(); if(zorunlu&&!v){ el('sebep-hata').classList.remove('hidden'); return; } kapat(v); };
    setTimeout(()=>el('sebep-metin')?.focus(),30);
  });
}

function tlRender(){

  sicht.forEach(e=>{ const k=tagKey(e.zaman); if(!idx.has(k)){ idx.set(k,tage.length); tage.push({k,e:[]}); } tage[idx.get(k)].e.push(e); });
  const filter=[['tumu','Tümü','#1a2e4a'],...Object.entries(TL_TUR).map(([k,v])=>[k,v[3],v[4]])].filter(x=>x[0]==='tumu'||zaehl(x[0])>0);
  const kopf=`<div class="tl-bar">
    <div class="tl-seg">${[['blok','Blok'],['liste','Liste'],['kachel','Kutucuk']].map(([v,l])=>`<button class="${gor===v?'on':''}" onclick="tlGor('${v}')">${l}</button>`).join('')}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${filter.map(([k,l,c])=>`<button class="tl-f" data-f="${k}" onclick="tlFiltre('${k}')" style="${f===k?`background:${c};border-color:${c};color:#fff`:''}"><i style="background:${f===k?'#fff':c}"></i>${l} (${zaehl(k)})</button>`).join('')}</div>
    <div style="display:flex;gap:12px"><button class="tl-lnk" onclick="tlAlle(true)">Tümünü aç</button><button class="tl-lnk" onclick="tlAlle(false)">Tümünü kapat</button></div></div>`;
  if(!sicht.length){ box.innerHTML=kopf+'<div class="card" style="margin-top:12px"><div class="card-body" style="text-align:center;color:#94a3b8;padding:40px">Kayıt yok</div></div>'; return; }
  const wt=k=>new Date(k+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long'});
  const dt=k=>new Date(k+'T12:00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const saat=z=>new Date(z).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'});
  const chips=t=>{ const z={}; t.e.forEach(e=>{ z[e.tur]=(z[e.tur]||0)+1; }); return Object.entries(z).map(([k,n])=>`<button class="day-chip" onclick="tlSprung('${t.k}','${k}')">${TL_TUR[k]?.[3]||k} ×${n}</button>`).join(''); };
  let inhalt='';

    return `<section class="day" id="tag-${t.k}"><div class="day-h"><button class="day-t" onclick="tlTag('${t.k}')" aria-expanded="${offen}"><span style="font-size:12px;color:#475569">${offen?'▾':'▸'}</span>
      <span class="day-d">${dt(t.k)}</span><span class="day-time">${sp}</span><span class="day-wd">${wt(t.k)}</span></button><div class="day-chips">${chips(t)}</div></div>
      ${offen?t.e.map((e,i)=>`<div class="ent" id="ent-${t.k}-${i}" data-tur="${e.tur}"><div class="ent-k"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0">
        <span style="font-weight:800;font-size:13px">${saat(e.zaman)}</span><span class="pill" style="${tlPill(e.tur)}">${escH(e.ad)}</span>
        <span style="font-size:12.5px;color:#1a2e4a;font-weight:700;overflow:hidden;text-overflow:ellipsis">${escH(tlTitel(e))}</span></div>
        <span class="mono" style="font-size:11.5px;color:#475569">${escH(e.ip||'—')} · ${escH(e.sehir||'—')} · ${escH(e.cihaz||'—')}</span></div>
        <div style="display:flex;gap:10px;align-items:flex-start">${e.ilan?.foto?`<img class="ent-img" ${imgKlein(e.ilan.foto,'64px')} alt="" loading="lazy">`:''}
        <div class="ent-grid" style="flex:1">${tlSpalten(e).map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div></div></div>`).join(''):''}</section>`; }).join('');
  if(gor==='liste') inhalt=`<div class="card" style="overflow-x:auto"><table style="min-width:820px"><thead><tr><th>Zaman</th><th>İşlem</th><th>Ayrıntı</th><th>Kategori</th><th>IP</th><th>Konum</th><th>Cihaz</th></tr></thead><tbody>

    inhalt=il.length?`<div class="kach">${il.map(e=>`<div><div class="kach-img">${e.ilan.foto?`<img ${imgKlein(e.ilan.foto,'200px')} alt="" loading="lazy">`:escH((e.ilan.kategori||'').split(' › ')[0]||'İlan')}</div>

      <div style="font-size:11.5px;color:#475569;margin-top:4px">${escH([e.ilan.kategori,e.ilan.marka,ZUSTAND[e.ilan.zustand]].filter(Boolean).join(' · '))}</div>
      <div style="font-size:11.5px;color:#475569">${fmtDate(e.zaman)} · ${escH(e.sehir||'—')}</div><div style="margin-top:6px">${ilanDurumBadge(e.ilan.durum)}</div></div></div>`).join('')}</div>`
      :'<div class="card"><div class="card-body" style="text-align:center;color:#94a3b8">Bu filtrede ilan yok</div></div>'; }
  box.innerHTML=kopf+`<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">${inhalt}</div>`;
}
function tlGor(v){ lsSet('kp_akte_gorunum',v); tlRender(); }
// Filter blendet Tage ohne Treffer aus und oeffnet die passenden (Medical 3b)
function tlFiltre(f){ TL.filtre=f; if(f!=='tumu'){ TL.offen=new Set(TL.liste.filter(e=>e.tur===f).map(e=>tagKey(e.zaman))); } tlRender(); }
function tlTag(k){ TL.offen.has(k)?TL.offen.delete(k):TL.offen.add(k); tlRender(); }
function tlAlle(auf){ TL.offen=auf?new Set(TL.liste.filter(e=>TL.filtre==='tumu'||e.tur===TL.filtre).map(e=>tagKey(e.zaman))):new Set(); tlRender(); }
// Tageschip = Sprung, kein Filter: Tag oeffnen, auf Blok, zum Eintrag scrollen, gelb aufblinken
function tlSprung(k,tur){
  TL.offen.add(k); if(tlGorunum()!=='blok') lsSet('kp_akte_gorunum','blok'); tlRender();
  const z=document.querySelector(`#tag-${CSS.escape(k)} .ent[data-tur="${tur}"]`);
  if(z){ z.scrollIntoView({behavior:'smooth',block:'center'}); z.classList.remove('tl-flash'); void z.offsetWidth; z.classList.add('tl-flash'); }
}

            <option value="bireysel"${e.hesap_tipi==='bireysel'?' selected':''}>Bireysel</option>
            <option value="kurumsal"${e.hesap_tipi==='kurumsal'?' selected':''}>Kurumsal</option>
            <option value="hepsi"${e.hesap_tipi==='hepsi'?' selected':''}>Hepsi</option>
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:20px">
          <input id="pk-aktif" type="checkbox" ${e.aktif?'checked':''} style="width:18px;height:18px;cursor:pointer"/>
          <label style="margin:0;cursor:pointer">Aktif</label>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-primary" onclick="paketKaydet()">${_paketEdit?'Güncelle':'Paket Ekle'}</button>
        ${_paketEdit?`<button class="btn btn-secondary" onclick="_paketEdit=null;vPaketler()">İptal</button>`:''}
      </div>
    </div>
  </div>

  <div class="card">
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Paket Adı</th><th style="text-align:center">Fiyat</th><th style="text-align:center">İlan Hakkı</th><th style="text-align:center">Süre</th><th>Hesap Tipi</th><th style="text-align:center">Aktif</th><th style="text-align:center">İşlem</th></tr></thead>
        <tbody>
          ${_paketList.length? _paketList.map(p=>`<tr>
            <td style="font-weight:600;color:#1a2e4a">${p.isim||''}</td>
            <td style="text-align:center;font-weight:700">${fmt(p.fiyat)}₺</td>
            <td style="text-align:center">${p.ilan_hakki} ilan</td>
            <td style="text-align:center">${p.sure_gun} gün</td>
            <td style="text-transform:capitalize;color:#64748b">${p.hesap_tipi||''}</td>
            <td style="text-align:center">
              <label class="toggle"><input type="checkbox" ${p.aktif?'checked':''} onchange="paketToggle(${p.id})"><span class="slider"></span></label>
            </td>
            <td style="text-align:center"><button class="btn btn-blue btn-sm" onclick="paketDuzenle(${p.id})">Düzenle</button></td>
          </tr>`).join('')
          :`<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:32px">Paket bulunamadı</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`);
}
function paketForm(){ return {isim:el('pk-isim').value,fiyat:parseFloat(el('pk-fiyat').value)||0,ilan_hakki:parseInt(el('pk-ilan').value)||0,sure_gun:parseInt(el('pk-sure').value)||30,hesap_tipi:el('pk-tip').value,aktif:el('pk-aktif').checked}; }
async function paketKaydet(){
  const f=paketForm(); if(!f.isim){showToast('Paket adı zorunlu','err');return;}
  if(_paketEdit) await api('/paketler/'+_paketEdit.id,{method:'PUT',body:JSON.stringify(f)});
  else await api('/paketler',{method:'POST',body:JSON.stringify(f)});
  showToast('Paket kaydedildi ✓');
  _paketEdit=null; vPaketler();
}
function paketDuzenle(id){ _paketEdit=_paketList.find(x=>x.id===id)||null; vPaketler(); }
async function paketToggle(id){ const p=_paketList.find(x=>x.id===id); if(!p)return; await api('/paketler/'+id,{method:'PUT',body:JSON.stringify({aktif:!p.aktif})}); showToast('Güncellendi ✓'); vPaketler(); }

let KAT_LISTE=null;
async function katLaden(neu){ if(!KAT_LISTE||neu) KAT_LISTE=await api('/kategoriler'); return KAT_LISTE; }
function katKopf(aktiv){ return `<nav class="akte-tabs" style="margin-bottom:16px">${[['kategoriler','Kategoriler','#/kategoriler'],['ozellikler','Özellikler (marka, seçenekler)','#/kategoriler/ozellikler']]
  .map(([k,l,h])=>`<a class="akte-tab${aktiv===k?' on':''}" href="${h}">${l}</a>`).join('')}</nav>`; }
async function vKategoriler(){
  const {arg}=aktuelleRoute();
  if(arg==='ozellikler') return vOzellikler();
  Vloading();
  const d=await katLaden(true).catch(()=>[]);
  const ana=d.filter(k=>!k.ust_id);
  const kinder=id=>d.filter(k=>k.ust_id===id);
  const alle=id=>{ const out=[]; const lauf=x=>kinder(x).forEach(c=>{ out.push(c); lauf(c.id); }); lauf(id); return out; };
  V(katKopf('kategoriler')+`<p style="font-size:13.5px;color:#64748b;margin-bottom:16px">${ana.length} ana kategori · ${d.length} kategori toplam</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px" id="kat-grid">
    ${ana.map(k=>{ const a=alle(k.id); const ilan=k.ilan+a.reduce((s,x)=>s+x.ilan,0);
      return `<a class="card" href="#/kategoriler/ozellikler?k=${k.id}" style="text-decoration:none"><div class="card-body" style="padding:16px">
      <p style="font-weight:700;color:#1a2e4a;font-size:14px">${escH(k.ad)}</p>
      <p style="font-size:12px;color:#94a3b8;margin-top:2px">${kinder(k.id).length} alt kategori · ${a.length} toplam · ${ilan} ilan</p>
      <p style="font-size:12px;color:#b61722;font-weight:700;margin-top:8px">Özellikler →</p></div></a>`; }).join('')}
  </div>`);
}
async function vOzellikler(){
  const {q}=aktuelleRoute(); const kid=+(q.get('k')||0);
  if(!el('oz-kat')){ Vloading();
    const d=await katLaden().catch(()=>[]);
    const kinder=id=>d.filter(k=>k.ust_id===id);
    const opt=(k,tiefe)=>`<option value="${k.id}">${'  '.repeat(tiefe*2)}${escH(k.ad)}${k.ozellik?` (${k.ozellik})`:''}</option>`+kinder(k.id).map(c=>opt(c,tiefe+1)).join('');
    V(katKopf('ozellikler')+`<div class="card" style="margin-bottom:12px"><div class="card-body" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:240px"><label for="oz-kat">Kategori</label><select id="oz-kat" onchange="history.replaceState(null,'','#/kategoriler/ozellikler?k='+this.value);vOzellikler()">
        <option value="">Kategori seçin…</option>${d.filter(k=>!k.ust_id).map(k=>opt(k,0)).join('')}</select></div>
      <p style="font-size:12.5px;color:#64748b;max-width:460px;line-height:1.6">Alt kategoriler üst kategorinin özelliklerini devralır (ör. marka listesi ana kategoride). Devralınan bir listeyi değiştirmek tüm alt kategorileri etkiler.</p>
    </div></div><div id="oz-liste"></div>`); }
  el('oz-kat').value=kid||'';
  const box=el('oz-liste');
  if(!kid){ box.innerHTML='<div class="card"><div class="card-body" style="text-align:center;color:#94a3b8;padding:40px">Özelliklerini düzenlemek için bir kategori seçin.</div></div>'; return; }
  box.innerHTML='<div style="padding:30px;text-align:center;color:#94a3b8">Yükleniyor…</div>';
  const t=await api('/kategoriler/'+kid+'/ozellikler').catch(()=>[]);
  if(!t.length){ box.innerHTML='<div class="card"><div class="card-body" style="color:#94a3b8">Bu kategoride (ve üst kategorilerinde) tanımlı özellik yok.</div></div>'; return; }
  box.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start">${t.map(o=>`<div class="card" data-tanim="${o.id}"><div class="card-body">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px"><div><p class="section-title" style="margin:0">${escH(o.etiket||o.alan_adi)}</p>
      <p style="font-size:12px;color:#64748b;margin-top:2px">${escH(o.alan_adi)} · ${escH(o.tip)}${o.zorunlu?' · zorunlu':''}${o.serbest?' · serbest giriş':''}</p></div>
      ${o.miras?`<span class="badge blue" title="Üst kategoriden devralındı">↑ ${escH(o.kategori_ad)}</span>`:'<span class="badge gray">bu kategori</span>'}</div>
    ${o.tip!=='secim'?'<p style="font-size:13px;color:#94a3b8">Serbest metin / sayı — seçenek listesi yok.</p>':`
      <div style="display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto" class="oz-werte">${o.secenekler.map((s,i)=>`<div class="ozb-row" style="align-items:center;padding:5px 0" data-id="${s.id}">
        <span style="display:flex;gap:6px;align-items:center;min-width:0"><span style="display:flex;flex-direction:column">
          <button class="sb-ikon-btn" style="color:#64748b;padding:0 4px;font-size:11px" title="Yukarı" ${i===0||s.deger==='Diğer'?'disabled':''} onclick="ozSirala(${o.id},${s.id},-1)">▲</button>
          <button class="sb-ikon-btn" style="color:#64748b;padding:0 4px;font-size:11px" title="Aşağı" ${s.deger==='Diğer'||o.secenekler[i+1]?.deger==='Diğer'||i===o.secenekler.length-1?'disabled':''} onclick="ozSirala(${o.id},${s.id},1)">▼</button></span>
          <span class="oz-deger" style="font-weight:600;overflow:hidden;text-overflow:ellipsis">${escH(s.deger)}</span>${s.kullanim?`<span class="badge gray" title="Bu değeri kullanan ilan">${s.kullanim} ilan</span>`:''}</span>
        ${s.deger==='Diğer'?'<span style="font-size:11.5px;color:#94a3b8">her zaman sonda</span>':`<span style="display:flex;gap:4px;flex-shrink:0"><button class="btn btn-secondary btn-sm" onclick="ozDegistir(${s.id},${s.kullanim})">Düzenle</button><button class="btn btn-danger btn-sm" onclick="ozSil(${s.id},${s.kullanim})">Kaldır</button></span>`}</div>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:10px"><input id="oz-yeni-${o.id}" placeholder="Yeni değer (ör. marka)" maxlength="100" onkeydown="if(event.key==='Enter')ozEkle(${o.id})"/><button class="btn btn-primary btn-sm" onclick="ozEkle(${o.id})">Ekle</button></div>`}
  </div></div>`).join('')}</div>`;
}
async function ozEkle(tid){ const i=el('oz-yeni-'+tid); const v=i.value.trim(); if(!v) return;
  await apiOk('/ozellik/'+tid+'/secenek',{method:'POST',body:JSON.stringify({deger:v})}); showToast('Eklendi ✓'); KAT_LISTE=null; vOzellikler(); }
async function ozSil(id,n){ if(!confirm(n?`Bu değeri ${n} ilan kullanıyor. Listeden kaldırılsın mı? (Mevcut ilanlar değerini korur.)`:'Bu değer listeden kaldırılsın mı?')) return;
  await apiOk('/secenek/'+id,{method:'DELETE'}); showToast('Kaldırıldı'); vOzellikler(); }
async function ozDegistir(id,n){
  const alt=document.querySelector(`.ozb-row[data-id="${id}"] .oz-deger`)?.textContent||'';
  const d=document.createElement('div'); d.className='modal-backdrop'; d.onclick=e=>{ if(e.target===d) d.remove(); };
  d.innerHTML=`<div class="modal"><p class="section-title">Değeri düzenle</p><input id="oz-duz" maxlength="100" value="${escH(alt)}"/>
    ${n?`<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:500"><input type="checkbox" id="oz-mevcut"> Bu değeri kullanan ${n} ilan da güncellensin</label>`:''}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btn-secondary" onclick="this.closest('.modal-backdrop').remove()">Vazgeç</button><button class="btn btn-primary" id="oz-kaydet">Kaydet</button></div></div>`;
  document.body.appendChild(d); el('oz-duz').focus();
  el('oz-kaydet').onclick=async()=>{ const v=el('oz-duz').value.trim(); if(!v) return;
    const r=await apiOk('/secenek/'+id,{method:'PUT',body:JSON.stringify({deger:v,mevcut:!!el('oz-mevcut')?.checked})}).catch(()=>null); if(!r) return;
    d.remove(); showToast('Kaydedildi ✓'+(r.guncellenen_ilan?` · ${r.guncellenen_ilan} ilan güncellendi`:'')); vOzellikler(); };
}
async function ozSirala(tid,id,yon){
  const ids=[...document.querySelectorAll(`[data-tanim="${tid}"] .ozb-row`)].map(x=>+x.dataset.id);
  const i=ids.indexOf(id), j=i+yon; if(j<0||j>=ids.length) return; [ids[i],ids[j]]=[ids[j],ids[i]];
  await apiOk('/ozellik/'+tid+'/sirala',{method:'POST',body:JSON.stringify({ids})}); vOzellikler();
}

    <span class="badge ${uyari.length?'amber':'green'}">${uyari.length?'⚠ Uyarı':'✓ OK'}</span>
  </div></div>
  ${!_ent.duzenle?`<p style="font-size:12.5px;color:#64748b;margin-bottom:12px">Yalnız görüntüleme: kaydetme ve test süper admin yetkisi ister.</p>`:''}
  <div class="ent-grid">${L.map(entKarte).join('')}</div>`);
  L.forEach(x=>{ if(_ent.offen[x.key]) entModelleriLaden(x); });
}
function entKarte(x){
  const [mAd,mRenk]=ENT_MOD[x.mod]||[x.mod,'gray'];
  const [hAd,hRenk]=ENT_HAZIR[x.readiness.durum]||[x.readiness.durum,'gray'];
  const r=x.readiness; const pct=r.toplam?Math.round(r.mevcut/r.toplam*100):100;
  const barRenk=pct===100?'#22c55e':pct>50?'#eab308':pct>0?'#f97316':'#ef4444';
  const testBadge=x.son_test_sonuc==='ok'?'<span class="badge green">✓ OK</span>':x.son_test_sonuc==='hata'?'<span class="badge red">✕ Hata</span>':'';
  const kopfFarbe={verified:'#f0fdf4',ready:'#eff6ff',missing:'#fef2f2',disabled:'#f8fafc'}[r.durum];
  return `<div class="card ent-karte" id="ent-${x.key}">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;background:${kopfFarbe}">
      <div style="display:flex;gap:12px;min-width:0">
        <div style="width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${x.ikon}</div>
        <div style="min-width:0"><p style="font-weight:700;color:#1a2e4a">${escH(x.ad)}${x.hazirlik?' <span class="badge gray" style="font-size:10px">hazırlanıyor</span>':''}</p>
        <p style="font-size:12px;color:#64748b">${escH(x.aciklama)}</p></div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end"><span class="badge ${mRenk}">${mAd}</span>${testBadge}</div>
    </div>
    <div style="padding:12px 16px 4px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge ${hRenk}"><span class="dot ${hRenk}"></span>${hAd}</span><code style="font-size:11.5px;color:#94a3b8">${x.mod}</code></div>
      <p style="font-size:13.5px;color:#334155;margin:8px 0">${escH(r.ozet)}</p>
      <div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${barRenk}"></div></div><code style="font-size:11.5px;color:#64748b">${r.mevcut}/${r.toplam}</code></div>
      ${r.eksik.length?`<p style="font-size:12px;color:#b91c1c;font-weight:600;margin-top:8px">✕ Eksik Alanlar</p><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${r.eksik.map(e=>`<code style="font-size:11px;background:#fef2f2;color:#b91c1c;padding:2px 6px;border-radius:5px">${escH(e)}</code>`).join('')}</div>`
        :`<p style="font-size:12px;color:#15803d;margin-top:8px">✓ Eksik alan yok</p>`}
      <button class="ent-link" onclick="entDetay('${x.key}')">${_ent.detay[x.key]?'▾':'▸'} Detaylar</button>
      ${_ent.detay[x.key]?`<div style="font-size:12px;color:#475569;background:#f8fafc;border-radius:9px;padding:10px 12px;margin-bottom:8px;line-height:1.8">
        ${x.alanlar.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${escH(a.label)}${a.zorunlu?' *':''}</span><span>${a.dolu?'✓':'—'} <code style="color:#94a3b8">${a.kaynak?ENT_KAYNAK[a.kaynak]:'yok'}</code></span></div>`).join('')}
        <div style="display:flex;justify-content:space-between"><span>Mod kaynağı</span><code style="color:#94a3b8">${x.modKaynak==='db'?'DB':'Standart'}</code></div>
        ${x.guncellendi_at?`<div style="display:flex;justify-content:space-between"><span>Son değişiklik</span><span>${fmtDateTime(x.guncellendi_at)}${x.guncelleyen?' · '+escH(x.guncelleyen):''}</span></div>`:''}
        ${x.turnstileTest?'<div style="color:#1d4ed8">Test modu: Cloudflare’in resmi test anahtarları kullanılır (her zaman geçer).</div>':''}
      </div>`:''}
    </div>
    <div style="border-top:1px solid #f1f5f9">
      <button class="ent-link" style="width:100%;justify-content:space-between;padding:10px 16px;margin:0" onclick="entAc('${x.key}')"><span>⚙ Yapılandır</span><span>${_ent.offen[x.key]?'▴':'▾'}</span></button>
      ${_ent.offen[x.key]?entForm(x):''}
    </div>
  </div>`;
}
function entForm(x){
  const dis=_ent.duzenle?'':'disabled';
  const kaynaklar=[...new Set(x.alanlar.filter(a=>a.kaynak).map(a=>ENT_KAYNAK[a.kaynak]))];
  return `<div style="padding:4px 16px 16px">
    <p style="font-size:12px;color:#64748b;margin-bottom:12px">ⓘ Gizli alanlar maskelenmiştir · Kaynak: ${kaynaklar.length?'('+kaynaklar.join(', ')+')':'—'}</p>
    <label>Çalışma Modu</label>
    <select id="ent-${x.key}-mod" ${dis} style="margin-bottom:12px">${x.modlar.map(m=>`<option value="${m}" ${m===x.mod?'selected':''}>${(ENT_MOD[m]||[m])[0]}</option>`).join('')}</select>
    ${x.alanlar.map(a=>{
      const id=`ent-${x.key}-${a.key}`;
      let feld;
      if(a.envSadece) feld=`<input id="${id}" value="${escH(a.dolu?a.deger:'')}" placeholder="tanımlı değil" disabled/><p style="font-size:11.5px;color:#94a3b8;margin-top:3px">Anahtar /etc/kapbeni.env içinde kalır${a.env?' ('+a.env+')':''}; buradan değiştirilemez.</p>`;
      else if(a.tip==='textarea') feld=`<textarea id="${id}" rows="3" ${dis} placeholder="${escH(a.placeholder)}">${escH(a.deger||'')}</textarea>`;
      else if(a.tip==='select') feld=`<select id="${id}" ${dis}>${[...new Set([a.deger,...(a.secenekler||[])].filter(Boolean))].map(v=>`<option value="${escH(v)}" ${v===a.deger?'selected':''}>${escH(v)}</option>`).join('')}</select>`;
      else if(a.secret) feld=`<input id="${id}" type="password" autocomplete="new-password" ${dis} value="" placeholder="${escH(a.dolu?a.deger+' (değiştirmek için yazın)':'tanımlı değil')}"/>`;
      else feld=`<input id="${id}" ${dis} value="${escH(a.kaynak==='db'?a.deger:'')}" placeholder="${escH(a.kaynak&&a.kaynak!=='db'?a.deger+' ('+ENT_KAYNAK[a.kaynak]+')':a.placeholder)}"/>`;
      return `<div style="margin-bottom:12px"><label>${escH(a.label)}${a.zorunlu?' <span style="color:#e53935">*</span>':''} <span style="font-weight:500;color:#94a3b8">${a.kaynak?'· '+ENT_KAYNAK[a.kaynak]:''}</span></label>${feld}</div>`;
    }).join('')}
    ${x.son_test_at?`<div style="font-size:12px;border-radius:9px;padding:9px 12px;margin-bottom:12px;background:${x.son_test_sonuc==='ok'?'#f0fdf4;color:#15803d':'#fef2f2;color:#b91c1c'}">🕒 <strong>Son Test:</strong> ${x.son_test_sonuc==='ok'?'PASS':'FAIL'} — ${escH(x.son_test_mesaj||'')} <span style="color:#94a3b8">(${fmtDateTime(x.son_test_at)})</span></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-blue" ${dis} onclick="entKaydet('${x.key}')">💾 Kaydet</button>
      <button class="btn btn-secondary" ${dis} onclick="entTest('${x.key}',this)">⚡ Bağlantı Testi</button>
    </div>
  </div>`;
}
function entDetay(k){ _ent.detay[k]=!_ent.detay[k]; entRender(); }
function entAc(k){ _ent.offen[k]=!_ent.offen[k]; entRender(); }
const _entModeller={};
async function entModelleriLaden(x){
  const a=x.alanlar.find(f=>f.dinamik==='claude-modeller'); if(!a) return;
  if(!_entModeller.claude){ try{ _entModeller.claude=await api('/entegrasyonlar/claude/modeller'); }catch{ _entModeller.claude=[]; } }
  const sel=el(`ent-${x.key}-${a.key}`); if(!sel||!Array.isArray(_entModeller.claude)) return;
  const ids=[...new Set([a.deger,..._entModeller.claude.map(m=>m.id)].filter(Boolean))];
  sel.innerHTML=ids.map(v=>`<option value="${escH(v)}" ${v===a.deger?'selected':''}>${escH(v)}</option>`).join('');
}
async function entKaydet(k){
  const x=_ent.liste.find(i=>i.key===k); if(!x) return;
  const degerler={};
  x.alanlar.forEach(a=>{ if(a.envSadece) return; const f=el(`ent-${k}-${a.key}`); if(!f) return;
    const v=f.value.trim();
    // Geheimfeld leer = unveraendert; Maskenwerte werden nie zurueckgeschrieben.
    if(a.secret){ if(v&&!v.startsWith('••••')) degerler[a.key]=v; }
    else degerler[a.key]=v; });
  const mod=el(`ent-${k}-mod`)?.value;
  const r=await fetch(API+'/entegrasyonlar/'+k,{method:'POST',headers:H(),body:JSON.stringify({mod,degerler})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){ showToast(d.hata||'Kaydedilemedi','err'); return; }
  const i=_ent.liste.findIndex(e=>e.key===k); if(i>=0&&d.entegrasyon) _ent.liste[i]=d.entegrasyon;
  showToast(x.ad+' kaydedildi ✓'); entRender();
}
async function entTest(k,btn){
  if(btn){btn.disabled=true;btn.textContent='Test ediliyor…';}
  const r=await fetch(API+'/entegrasyonlar/'+k+'/test',{method:'POST',headers:H()});
  const d=await r.json().catch(()=>({}));
  showToast((d.ok?'✓ ':'✕ ')+(d.mesaj||d.hata||'Test başarısız'),d.ok?'ok':'err');
  await vEntegrasyonlar(); _ent.offen[k]=true; entRender();
}
