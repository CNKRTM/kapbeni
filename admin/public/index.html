<body>
<div id="toast" class="toast"></div>
<div id="app"></div>
<script>
// API-Basis relativ zur Seitenadresse: oeffentlich /kapbeniadmin/admin/api
// (nginx streicht /kapbeniadmin), im LAN direkt :3002/admin/api.
const API=location.pathname.replace(/(\/admin)(\/.*)?$/,'$1')+'/api';
let TOKEN=localStorage.getItem('admin_token')||'';

function H(){ return {'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'} }

async function api(path,opts={}){
  try{
    const r=await fetch(API+path,{...opts,headers:{...H(),...(opts.headers||{})}});
    if(r.status===401){logout();throw new Error('401');}
    if(r.status===423){kilitEkrani();throw new Error('401');}
    const ct=r.headers.get('content-type')||'';
    return ct.includes('json')?r.json():r.text();
  }catch(e){if(e.message!=='401')showToast('Bağlantı hatası: '+path,'err'); throw e;}
}

let _toastTimer=null;
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='err'?'#b91c1c':'#1a2e4a';
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

let ADMIN=null;
// Abmelden: Sitzung serverseitig schliessen, dann lokal aufraeumen.
function logout(){
  const t=TOKEN; localStorage.removeItem('admin_token'); TOKEN=''; ADMIN=null; clearInterval(_sbTimer);
  if(t) fetch(API+'/cikis',{method:'POST',headers:{'Authorization':'Bearer '+t}}).catch(()=>{});
  history.replaceState(null,'','#/giris'); renderLogin();
}
async function benLaden(){
  try{ const r=await fetch(API+'/ben',{headers:{...H(),'X-Kp-Arka':'1'}}); if(r.status===401){ logout(); return null; }
    const d=await r.json(); ADMIN=d.admin; const t=el('topbar-admin'); if(t&&ADMIN) t.textContent=(ADMIN.ad_soyad||ADMIN.email)+' · '+(TR_ROL[ADMIN.rol]||ADMIN.rol);
    if(d.kilitli){ el('kilit')?.remove(); kilitEkrani(); } else if(KILITLI){ kilitKaldir(); routeAnwenden(); }
    return d; }catch{ return null; }
}
const el=id=>document.getElementById(id);
const escH=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('tr-TR');
const fmtDate=d=>d?new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDateTime=d=>d?new Date(d).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const stars=n=>{let s='';for(let i=0;i<5;i++)s+=`<span class="${i<(n||0)?'star-filled':'star-empty'}">★</span>`;return s;}

// ═══════════════════════════════════════════════
// LOGIN (Aufbau nach Compendus Medical, Farben/Schrift Kapbeni-Admin)
// Links: Flaeche #1a2e4a mit weisser Logo-Karte. Rechts: Staging-Banner,
// Titel, Formular-Karte, Hinweise, Fuss mit Version/Commit und Compendus.
// Unterseiten per Hash: #/giris, #/sifremi-unuttum, #/yeni-sifre?t=…
// ═══════════════════════════════════════════════
let GIRIS_CFG=null;
async function girisCfgLaden(){
  if(GIRIS_CFG) return GIRIS_CFG;
  try{ const r=await fetch(API+'/giris-yapilandirma'); GIRIS_CFG=r.ok?await r.json():{}; }catch{ GIRIS_CFG={}; }
  return GIRIS_CFG;
}
const ORTAM='__APP_ORTAM__';
function girisSayfasi(inner){
  const c=GIRIS_CFG||{};
  const staging=ORTAM!=='prod';
  document.getElementById('app').innerHTML=`
  <div class="giris-wrap">
    <div class="giris-sol">
      <div class="giris-logo-karte">
        <img src="img/kapbeni-logo.webp" alt="Kap Beni" style="width:100%;max-width:300px;height:auto"/>
        <p style="font-size:17px;font-weight:800;color:#1a2e4a;margin-top:18px">Kap Beni – Yönetim Paneli</p>
        ${staging?'<span class="badge amber" style="margin-top:10px">Test Staging Server</span>':''}
      </div>
      <p style="color:#94a3b8;font-size:12.5px;margin-top:22px;text-align:center;max-width:320px;line-height:1.6">İlanlar, müşteriler ve sistem ayarları için yetkili personel paneli.</p>
    </div>
    <div class="giris-sag">
      ${staging?'<div class="giris-banner">TEST SUNUCUSU (STAGING) · Burası canlı sistem değildir. Veriler test amaçlıdır.</div>':''}
      <div class="giris-mitte">
        <div style="width:100%;max-width:400px">
          <div style="text-align:center;margin-bottom:18px">
            <img src="img/kapbeni-logo.webp" alt="Kap Beni" class="giris-mobil-logo"/>
            <h1 id="giris-baslik" style="font-size:22px;font-weight:800;color:#1a2e4a">Yönetici Girişi</h1>
          </div>
          ${inner}
          <div style="margin-top:18px;font-size:12px;color:#64748b;line-height:1.7;text-align:center">
            <div>🔒 Bu alan yalnızca yetkili personel içindir.</div>
            <div>Tüm giriş denemeleri IP adresi ile kayıt altına alınır.</div>
          </div>
        </div>
      </div>
      <div class="giris-fuss">
        <span id="giris-version">Kap Beni v${escH(c.version||'__APP_VERSION__')}${c.commit?' · '+escH(c.commit):''}</span>
        <img src="img/compendus-logo.webp" alt="Compendus" style="height:22px;width:auto"/>
        <span>© Compendus Ltd. Şti. — Kap Beni bir Compendus ürünüdür</span>
      </div>
    </div>
  </div>`;
}
function girisFehler(t){ const e=el('login-err'); if(!e) return; e.textContent=t; e.classList.remove('hidden'); }
function girisFormHtml(){
  const c=GIRIS_CFG||{};
  const g=c.google||{};
  return `<div class="card"><div class="card-body" style="padding:24px">
    <div id="login-err" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-medium"></div>
    <div id="login-info" class="hidden mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-800 rounded-xl text-sm font-medium"></div>
    <div class="space-y-3">
      <div><label for="login-email">E-posta</label><input id="login-email" type="email" autocomplete="username" placeholder="ad@kapbeni.com" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div><label for="login-pw">Şifre</label><input id="login-pw" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div id="ts-giris" class="ts-slot"></div>
      <button id="login-btn" onclick="doLogin()" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px">Giriş Yap</button>
      <div style="text-align:right"><a href="#/sifremi-unuttum" id="sifre-unuttum-link" style="font-size:12.5px;font-weight:600;color:#475569">Şifremi unuttum</a></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0 12px"><div style="flex:1;height:1px;background:#e2e8f0"></div><span style="font-size:12px;color:#94a3b8">veya</span><div style="flex:1;height:1px;background:#e2e8f0"></div></div>
    <button id="google-btn" class="btn btn-secondary" style="width:100%;justify-content:center;padding:12px" ${g.aktif?`onclick="location.href=API+'/google/baslat'"`:'disabled title="Yakında"'}>
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.6h12.7c-.6 3-2.3 5.5-4.8 7.2v6h7.7c4.5-4.1 7-10.2 7-17.3z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.7-6c-2.1 1.4-4.8 2.3-8.1 2.3-6.2 0-11.5-4.2-13.4-9.9H2.7v6.2C6.5 42.5 14.7 48 24 48z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6v-6.2H2.7C1 16.2 0 20 0 24s1 7.8 2.7 10.8l7.9-6.2z"/><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.5 0 24 0 14.7 0 6.5 5.5 2.7 13.4l7.9 6.2C12.5 13.7 17.8 9.5 24 9.5z"/></svg>
      Google ile giriş${g.aktif?'':' <span class="badge gray" style="margin-left:4px">Yakında</span>'}
    </button>
  </div></div>`;
}
async function renderLogin(){ await girisCfgLaden(); girisRoute(); }
function girisRoute(){
  if(TOKEN&&el('view')) return;
  const {r,q}=aktuelleRoute();
  if(r==='sifremi-unuttum') return unuttumSayfa();
  if(r==='yeni-sifre') return yeniSifreSayfa(q.get('t')||'');
  girisSayfasi(girisFormHtml());
  setTimeout(()=>el('login-email')?.focus(),50);
}

const SIFRE_KURALLAR=[['en az 10 karakter',p=>p.length>=10],['büyük harf',p=>/[A-ZÇĞİÖŞÜ]/.test(p)],['küçük harf',p=>/[a-zçğıöşü]/.test(p)],['rakam',p=>/\d/.test(p)]];

  const k=el('yeni-kutu'); if(!k) return;

  k.innerHTML=`<p style="font-weight:700;color:#1a2e4a;margin-bottom:12px">Yeni şifrenizi belirleyin</p>
    <div id="login-err" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-medium"></div>

      <ul id="yeni-kurallar" style="font-size:12px;line-height:1.8;color:#64748b"></ul>
      <button id="yeni-btn" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px" onclick="yeniKaydet()">Şifreyi kaydet</button>
    </div>`;

function yeniKural(){
  const p=el('yeni-pw')?.value||'', p2=el('yeni-pw2')?.value||'';
  const liste=[...SIFRE_KURALLAR.map(([ad,f])=>[ad,f(p)]),['iki şifre aynı',!!p&&p===p2]];
  const u=el('yeni-kurallar'); if(u) u.innerHTML=liste.map(([ad,ok])=>`<li style="color:${ok?'#15803d':'#94a3b8'}">${ok?'✓':'○'} ${ad}</li>`).join('');
  return liste.every(([,ok])=>ok);
}
async function yeniKaydet(){
  if(!yeniKural()){ girisFehler('Şifre kurallarını sağlayın'); return; }
  const btn=el('yeni-btn'); btn.disabled=true;
  try{
    const r=await fetch(API+'/sifre-yenile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:el('yeni-kutu').dataset.t,password:el('yeni-pw').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ girisFehler(d.hata||'Şifre güncellenemedi'); return; }
    el('yeni-kutu').innerHTML=`<div class="p-3 bg-green-50 border border-green-200 text-green-800 rounded-xl text-sm font-medium" id="yeni-ok">${escH(d.mesaj)}</div>
      <a href="#/giris" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;margin-top:14px">Girişe git</a>`;
  }catch{ girisFehler('Sunucuya bağlanılamadı'); }
  finally{ if(btn) btn.disabled=false; }
}

async function doLogin(){
  const email=el('login-email')?.value.trim(), pw=el('login-pw')?.value;
  if(!email||!pw){ girisFehler('E-posta ve şifre gerekli'); return; }
  const btn=el('login-btn'); if(btn){btn.disabled=true;btn.textContent='Giriş yapılıyor…';}
  try{
    const r=await fetch(API+'/giris',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,turnstile:tsToken('ts-giris')})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ girisFehler(d.hata||d.message||'Giriş başarısız'); tsReset('ts-giris'); return; }
    TOKEN=d.token; localStorage.setItem('admin_token',TOKEN);
    ADMIN=d.admin||null;
    if(!location.hash||/^#\/(giris|sifremi-unuttum|yeni-sifre)/.test(location.hash)) history.replaceState(null,'','#/dashboard');
    kilitKaldir(); renderApp(); kilitWaechter(); routeAnwenden();
  }catch(e){ girisFehler('Sunucuya bağlanılamadı'); }
  finally{ if(btn){btn.disabled=false;btn.textContent='Giriş Yap';} }
}

// BILDSCHIRMSPERRE (Aufbau nach Compendus Medical „Ekran kilitli“)
// Nach 15 Minuten ohne Aktivitaet: Overlay, Inhalt verschwommen und geleert.
// Der Server fuehrt den Zustand (admin_oturumlar.kilitli) und verweigert
// solange jede Datenanfrage mit 423 — die Sperre uebersteht ein Neuladen.
// ═══════════════════════════════════════════════
const KILIT_MS=15*60*1000;
let _sonAktivite=Date.now(), _sonHerzschlag=Date.now(), _kilitUhr=null, _kilitTimer=null, KILITLI=false;
['mousemove','keydown','click','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ if(!KILITLI) _sonAktivite=Date.now(); },{passive:true,capture:true}));
function kilitWaechter(){
  clearInterval(_kilitTimer);
  _kilitTimer=setInterval(()=>{
    if(!TOKEN||KILITLI||!el('view')) return;
    const jetzt=Date.now();
    if(jetzt-_sonAktivite>=KILIT_MS){ kilitle('hareketsizlik'); return; }
    // Herzschlag hoechstens jede Minute, nur wenn der Nutzer wirklich etwas tat
    if(_sonAktivite>_sonHerzschlag&&jetzt-_sonHerzschlag>=60000){
      _sonHerzschlag=jetzt; fetch(API+'/aktivite',{method:'POST',headers:H()}).then(r=>{ if(r.status===423) kilitEkrani(); }).catch(()=>{});
    }
  },15000);
}
async function kilitle(sebep='manuel'){
  kilitEkrani();
  try{ await fetch(API+'/kilitle',{method:'POST',headers:H(),body:JSON.stringify({sebep})}); }catch{}
}
const TR_ROL={super_admin:'Süper Admin',admin:'Admin',support:'Destek',moderator:'Moderatör'};
function kilitEkrani(){
  KILITLI=true; lsSet('kp_kilitli',true);
  const v=el('view'); if(v) v.innerHTML='';           // Daten verschwinden, nicht nur verdeckt (KVKK)
  document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove());
  if(el('kilit')) return;
  const a=ADMIN||{}; const ad=a.ad_soyad||a.email||'Yönetici';
  const ini=ad.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr-TR')||'KB';
  const d=document.createElement('div'); d.id='kilit'; d.className='kilit';
  d.innerHTML=`
    <div class="kilit-sol">
      <div id="kilit-saat" class="kilit-saat"></div>
      <div id="kilit-tarih" class="kilit-tarih"></div>
      <div class="kilit-compendus"><img src="img/compendus-logo.webp" alt="Compendus" style="height:30px;width:auto"/><p style="font-size:12px;color:#64748b;margin-top:8px">Kap Beni bir Compendus ürünüdür</p></div>
      <p class="kilit-kvkk">🔒 Müşteri verileri kilitli ekranda gizlidir (KVKK)</p>
    </div>
    <div class="kilit-sag">
      <div class="kilit-karte">
        <img src="img/kapbeni-logo.webp" alt="Kap Beni" style="height:40px;width:auto;margin:0 auto 14px;display:block"/>
        <h2 style="font-size:20px;font-weight:800;color:#1a2e4a;text-align:center">Ekran kilitli</h2>
        <p style="font-size:13px;color:#64748b;text-align:center;margin:6px 0 16px;line-height:1.6">Bir süre işlem yapılmadığı için ekran kilitlendi. Oturumunuz açık; devam etmek için şifrenizi girin.</p>
        <div style="display:flex;align-items:center;gap:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:14px">
          <div style="width:42px;height:42px;border-radius:50%;background:#1a2e4a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">${escH(ini)}</div>
          <div style="min-width:0"><p id="kilit-ad" style="font-weight:700;color:#1a2e4a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(ad)}</p><p style="font-size:12px;color:#64748b">${escH(TR_ROL[a.rol]||a.rol||'')}</p></div>
        </div>
        <div id="kilit-hata" class="hidden mb-3 p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-medium"></div>
        <label for="kilit-pw">Şifre</label>
        <input id="kilit-pw" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')kilitAc()"/>
        <button id="kilit-btn" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;margin-top:12px" onclick="kilitAc()">Kilidi aç</button>
        <button class="ent-link" style="margin:14px auto 0" onclick="kilitCikis()">Başka kullanıcıyla giriş / Çıkış</button>
      </div>
    </div>`;
  document.body.appendChild(d);
  const uhr=()=>{ const n=new Date(); const s=el('kilit-saat'), t=el('kilit-tarih'); if(!s) return clearInterval(_kilitUhr);
    s.textContent=n.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    t.textContent=n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); };
  uhr(); clearInterval(_kilitUhr); _kilitUhr=setInterval(uhr,1000);
  setTimeout(()=>el('kilit-pw')?.focus(),50);
}
function kilitKaldir(){
  KILITLI=false; lsSet('kp_kilitli',false); clearInterval(_kilitUhr);
  el('kilit')?.remove(); _sonAktivite=Date.now(); _sonHerzschlag=Date.now();
}
async function kilitAc(){
  const pw=el('kilit-pw')?.value; const h=el('kilit-hata');
  if(!pw){ el('kilit-pw')?.focus(); return; }
  const btn=el('kilit-btn'); btn.disabled=true;
  try{
    const r=await fetch(API+'/kilit-ac',{method:'POST',headers:H(),body:JSON.stringify({password:pw})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ kilitKaldir(); routeAnwenden(); sbSayacLaden(); return; }
    if(d.cikis||r.status===401){ kilitKaldir(); logout(); setTimeout(()=>girisFehler(d.hata||'Oturum kapatıldı'),100); return; }
    h.textContent=d.hata||'Şifre hatalı'; h.classList.remove('hidden'); el('kilit-pw').value=''; el('kilit-pw').focus();
  }catch{ h.textContent='Sunucuya bağlanılamadı'; h.classList.remove('hidden'); }
  finally{ btn.disabled=false; }
}
function kilitCikis(){ kilitKaldir(); logout(); }

const istMobil=()=>window.matchMedia('(max-width:768px)').matches;

function sbItemHtml(i,aktiv){
  const say=i.sayac&&SB_SAYAC[i.sayac]!=null?`<span class="sayac">(${fmt(SB_SAYAC[i.sayac])})</span>`:'';
  return `<a class="nav-item${aktiv===i.id?' active':''}" id="nav-${i.id}" href="#/${i.id}" title="${escH(i.label)}" onclick="sbMobilZu()">
    <span class="icon">${i.icon}</span><span class="label">${escH(i.label)}</span>${say}${yeniSichtbar(i)?'<span class="yeni-plakette">YENİ</span>':''}${i.hazirlaniyor?'<span class="hz">yakında</span>':''}</a>`;

function renderSidebar(){
  const sb=el('sidebar'); if(!sb) return;
  const aktiv=aktuelleRoute().r;
  const offen=lsGet('kp_sb_gruplar',{});
  const daralt=!istMobil()&&lsGet('kp_sb_daralt',false);
  sb.classList.toggle('daralt',daralt);
  sb.style.setProperty('--sb-w',lsGet('kp_sb_genislik',248)+'px');
  const gruppen=SIDEBAR.map(g=>{
    const enthaeltAktiv=g.items.some(i=>i.id===aktiv||(i.children||[]).some(c=>c.id===aktiv));
    const auf=daralt||enthaeltAktiv||offen[g.id]!==false;
    const yeni=g.items.some(i=>yeniSichtbar(i)||(i.children||[]).some(yeniSichtbar));
    const items=g.items.map(i=>{
      if(!i.children) return sbItemHtml(i,aktiv);
      // Eltern mit eigener Seite (Müşteriler) bleiben klickbar; ohne Seite (İlanlar) nur Ueberschrift.
      const kopf=i.id==='ilanlar'
        ? `<div class="nav-item" style="cursor:default" title="${escH(i.label)}"><span class="icon">${i.icon}</span><span class="label">${escH(i.label)}</span></div>`
        : sbItemHtml(i,aktiv);
      return kopf+`<div class="nav-alt">${i.children.map(c=>sbItemHtml(c,aktiv)).join('')}</div>`;
    }).join('');
    return `<div class="sb-grup">
      <button class="sb-grup-kopf${auf?'':' zu'}" data-grup="${g.id}" onclick="sbGruppe('${g.id}',${auf})"><span${g.lang?` lang="${g.lang}"`:''}>${escH(g.label)}${yeni?'<span class="yeni-plakette">YENİ</span>':''}</span><span class="pfeil">▾</span></button>

// ── Hash-Routing: #/<seite>[/<arg>][?query] — Browser-Zurück bleibt im Admin ──
function aktuelleRoute(){
  const h=location.hash.replace(/^#\/?/,''); const [pfad,qs]=h.split('?');
  const t=(pfad||'').split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x)}catch{return x}});
  let r=t[0]||'dashboard'; const alias=!!ROUTE_ALIAS[r]; if(alias) r=ROUTE_ALIAS[r];
  return {r,arg:t[1]||null,q:new URLSearchParams(qs||''),alias};
}
function route(r){ const h='#/'+r; if(location.hash!==h) location.hash=h; else routeAnwenden(); }
function routeAnwenden(){
  if(!el('view')) return;
  const {r,arg,alias}=aktuelleRoute();
  if(alias) history.replaceState(null,'','#/'+r);
  if(/^(giris|sifremi-unuttum|yeni-sifre)$/.test(r)){ history.replaceState(null,'','#/dashboard'); return routeAnwenden(); }
  renderSidebar();
  const eintrag=sbEintrag(r);
  const t=el('topbar-title'); if(t) t.textContent=PAGE_TITLES[r]||eintrag?.label||r;
  window.scrollTo(0,0);
  if(eintrag?.hazirlaniyor) return vHazirlaniyor(eintrag);
  if(r==='kullanicilar'&&arg) return kDetayGoster(arg);
  const views={
    dashboard:vDashboard,kullanicilar:vKullanicilar,kyc:vKyc,kurumsalonay:vKurumsalOnay,
    ilanonay:vIlanOnay,riskmesaj:vRiskMesaj,ilanlaryayin:vIlanlarYayin,ilansikayet:vIlanSikayet,degerlendirmeler:vDegerlendirmeler,
    destektickets:vDestekTickets,oneriler:vOneriler,
    abonelikler:vAbonelikler,paketler:vPaketler,kuponlar:vKuponlar,
    vitaminler:vVitaminler,slider:vSlider,kategoriler:vKategoriler,
    waayar:vWaAyar,entegrasyonlar:vEntegrasyonlar,ayarlar:vAyarlar
  };
  (views[r]||vDashboard)();
}
window.addEventListener('hashchange',()=>{ if(TOKEN&&el('view')) routeAnwenden(); else if(typeof girisRoute==='function') girisRoute(); });

// Pruefung ausgefallen ist. Nutzt die vorhandenen Endpunkte
// GET /ilanlar?durum=moderasyonda, POST /ilanlar/:id/onayla und /reddet.

async function vIlanOnay(){
  Vloading();
  const d=await api('/ilanlar?durum=moderasyonda&limit=100').catch(()=>[]);
  if(!(d||[]).length){V(`<div class="card"><div class="card-body" style="text-align:center;padding:48px;color:#94a3b8">🎉 Onay bekleyen ilan yok</div></div>`);return;}
  V(`<div style="display:flex;flex-direction:column;gap:12px">
    ${d.map(i=>{
      const hata=i.ai_karar==='hata';
      const sk=i.ai_score;
      const skC=hata||sk==null?'gray':sk<40?'red':sk<70?'amber':'green';
      return `<div class="card"><div class="card-body">
        <div style="display:flex;align-items:flex-start;gap:16px">
          ${i.ana_foto?`<img src="${escH(i.ana_foto)}" style="width:84px;height:84px;object-fit:cover;border-radius:10px;flex-shrink:0">`:''}
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
              <span class="badge ${skC}"><div class="dot ${skC}"></div>${hata?'KI-Prüfung ausgefallen':'KI-Güven '+(sk??'—')}</span>
              <span style="font-size:12px;color:#64748b">${escH(i.kategori_ad||'Kategori yok')} · ${fmtDate(i.created_at)}</span>
            </div>
            <p style="font-weight:700;color:#1a2e4a;margin-bottom:2px">${escH(i.baslik)} — ${fmt(i.fiyat)}₺</p>
            <p style="font-size:12.5px;color:#64748b;margin-bottom:8px">${escH([i.ad,i.soyad].filter(Boolean).join(' '))} · ${escH(i.email)} · ${escH(i.sehir||'')}</p>
            <div style="background:#f8fafc;border-radius:8px;padding:10px 14px;font-size:13.5px;color:#334155;white-space:pre-wrap;max-height:140px;overflow:auto">${escH(i.aciklama||'')}</div>
            ${i.ai_not?`<p style="margin-top:8px;font-size:12.5px;color:${hata?'#64748b':'#b91c1c'}">🤖 ${escH(i.ai_not)}</p>`:''}
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">
            <a class="btn btn-secondary btn-sm" href="https://kapbeni.com/#/ilan/${escH(i.uuid)}" target="_blank" rel="noopener">👁 Ansehen</a>
            <button class="btn btn-success btn-sm" onclick="ilanOnayla(${+i.id})">✅ Onayla</button>
            <button class="btn btn-secondary btn-sm" style="color:#b91c1c" onclick="ilanReddet(${+i.id})">✕ Reddet</button>
          </div>
        </div>
      </div></div>`;
    }).join('')}
  </div>`);
}
async function ilanOnayla(id){
  await api('/ilanlar/'+id+'/onayla',{method:'POST'});
  showToast('İlan yayına alındı ✓');
  vIlanOnay();
}
async function ilanReddet(id){
  const sebep=prompt('Red sebebi (satıcıya gösterilir):','');
  if(sebep===null) return;
  await api('/ilanlar/'+id+'/reddet',{method:'POST',body:JSON.stringify({sebep})});
  showToast('İlan reddedildi');
  vIlanOnay();
}

  await api('/support-tickets/'+id,{method:'PATCH',body:JSON.stringify({durum:'kapali'})});

let _paketList=[], _paketEdit=null;
async function vPaketler(){
  Vloading();
  _paketList=await api('/paketler').catch(()=>[])||[];
  const e=_paketEdit||{isim:'',fiyat:'',ilan_hakki:'',sure_gun:'',hesap_tipi:'bireysel',aktif:true};

  V(`
  <div class="card" style="margin-bottom:20px;max-width:640px">
    <div class="card-body">
      <p class="section-title">${_paketEdit?'Paketi Düzenle':'Yeni Paket Ekle'}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div style="grid-column:1/-1">
          <label>Paket Adı</label>
          <input id="pk-isim" value="${(e.isim||'').replace(/"/g,'&quot;')}" placeholder="örn. Standart, Premium…"/>
        </div>
        <div><label>Fiyat (₺)</label><input id="pk-fiyat" type="number" value="${e.fiyat??''}"/></div>
        <div><label>İlan Hakkı</label><input id="pk-ilan" type="number" value="${e.ilan_hakki??''}"/></div>
        <div><label>Süre (Gün)</label><input id="pk-sure" type="number" value="${e.sure_gun??''}"/></div>
        <div>
          <label>Hesap Tipi</label>
          <select id="pk-tip">
            <option value="bireysel"${e.hesap_tipi==='bireysel'?' selected':''}>Bireysel</option>
            <option value="kurumsal"${e.hesap_tipi==='kurumsal'?' selected':''}>Kurumsal</option>
            <option value="hepsi"${e.hesap_tipi==='hepsi'?' selected':''}>Hepsi</option>
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:20px">
          <input id="pk-aktif" type="checkbox" ${e.aktif?'checked':''} style="width:18px;height:18px;cursor:pointer"/>
          <label style="margin:0;cursor:pointer">Aktif</label>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-primary" onclick="paketKaydet()">${_paketEdit?'Güncelle':'Paket Ekle'}</button>
        ${_paketEdit?`<button class="btn btn-secondary" onclick="_paketEdit=null;vPaketler()">İptal</button>`:''}
      </div>
    </div>
  </div>

  <div class="card">
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Paket Adı</th><th style="text-align:center">Fiyat</th><th style="text-align:center">İlan Hakkı</th><th style="text-align:center">Süre</th><th>Hesap Tipi</th><th style="text-align:center">Aktif</th><th style="text-align:center">İşlem</th></tr></thead>
        <tbody>
          ${_paketList.length? _paketList.map(p=>`<tr>
            <td style="font-weight:600;color:#1a2e4a">${p.isim||''}</td>
            <td style="text-align:center;font-weight:700">${fmt(p.fiyat)}₺</td>
            <td style="text-align:center">${p.ilan_hakki} ilan</td>
            <td style="text-align:center">${p.sure_gun} gün</td>
            <td style="text-transform:capitalize;color:#64748b">${p.hesap_tipi||''}</td>
            <td style="text-align:center">
              <label class="toggle"><input type="checkbox" ${p.aktif?'checked':''} onchange="paketToggle(${p.id})"><span class="slider"></span></label>
            </td>
            <td style="text-align:center"><button class="btn btn-blue btn-sm" onclick="paketDuzenle(${p.id})">Düzenle</button></td>
          </tr>`).join('')
          :`<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:32px">Paket bulunamadı</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`);
}
function paketForm(){ return {isim:el('pk-isim').value,fiyat:parseFloat(el('pk-fiyat').value)||0,ilan_hakki:parseInt(el('pk-ilan').value)||0,sure_gun:parseInt(el('pk-sure').value)||30,hesap_tipi:el('pk-tip').value,aktif:el('pk-aktif').checked}; }
async function paketKaydet(){
  const f=paketForm(); if(!f.isim){showToast('Paket adı zorunlu','err');return;}
  if(_paketEdit) await api('/paketler/'+_paketEdit.id,{method:'PUT',body:JSON.stringify(f)});
  else await api('/paketler',{method:'POST',body:JSON.stringify(f)});
  showToast('Paket kaydedildi ✓');
  _paketEdit=null; vPaketler();
}
function paketDuzenle(id){ _paketEdit=_paketList.find(x=>x.id===id)||null; vPaketler(); }
async function paketToggle(id){ const p=_paketList.find(x=>x.id===id); if(!p)return; await api('/paketler/'+id,{method:'PUT',body:JSON.stringify({aktif:!p.aktif})}); showToast('Güncellendi ✓'); vPaketler(); }

// KUPONLAR CRUD
// ═══════════════════════════════════════════════
function kuponGen(){ return Math.random().toString(36).substring(2,8).toUpperCase(); }
async function vKuponlar(){
  Vloading();
  const d=await api('/paket-kuponlari').catch(()=>[]);
  V(`
  <div class="card" style="margin-bottom:20px;max-width:640px">
    <div class="card-body">
      <p class="section-title">Yeni Kupon Oluştur</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div style="grid-column:1/-1;display:flex;gap:10px">
          <input id="kp-kod" placeholder="Kupon kodu (boş = otomatik)" style="text-transform:uppercase;letter-spacing:.1em;font-weight:600"/>
          <button class="btn btn-secondary" onclick="el('kp-kod').value=kuponGen()" style="white-space:nowrap">🎲 Oluştur</button>
        </div>
        <div>
          <label>İndirim Türü</label>
          <select id="kp-tip">
            <option value="yuzde">Yüzde (%)</option>
            <option value="sabit">Sabit (₺)</option>
          </select>
        </div>
        <div><label>İndirim Değeri</label><input id="kp-deger" type="number" placeholder="örn. 20"/></div>
        <div><label>Kullanım Limiti (opsiyonel)</label><input id="kp-limit" type="number" placeholder="Limitsiz"/></div>
        <div><label>Bitiş Tarihi (opsiyonel)</label><input id="kp-bitis" type="date"/></div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:20px">
          <input id="kp-aktif" type="checkbox" checked style="width:18px;height:18px;cursor:pointer"/>
          <label style="margin:0;cursor:pointer">Aktif</label>
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="kuponKaydet()">🏷️ Kupon Oluştur</button>
    </div>
  </div>

  <div class="card">
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Kod</th><th>Tür</th><th style="text-align:center">Değer</th><th style="text-align:center">Kullanım</th><th style="text-align:center">Bitiş</th><th style="text-align:center">Aktif</th></tr></thead>
        <tbody>
          ${(d||[]).length? (d||[]).map(k=>`<tr>
            <td><code style="font-size:14px;font-weight:700;letter-spacing:.12em;color:#1a2e4a">${k.kod||''}</code></td>
            <td style="text-transform:capitalize;color:#64748b">${k.indirim_tipi==='yuzde'?'Yüzde':'Sabit'}</td>
            <td style="text-align:center;font-weight:700">${k.indirim_tipi==='yuzde'?'%'+k.indirim_degeri:fmt(k.indirim_degeri)+'₺'}</td>
            <td style="text-align:center;color:#64748b">${k.kullanim_sayisi||0}${k.kullanim_limiti?'/'+k.kullanim_limiti:''}</td>
            <td style="text-align:center;color:${k.gecerlilik_bitis&&new Date(k.gecerlilik_bitis)<new Date()?'#b91c1c':'#64748b'};font-size:13px">${fmtDate(k.gecerlilik_bitis)}</td>
            <td style="text-align:center">
              <label class="toggle"><input type="checkbox" ${k.aktif?'checked':''} onchange="kuponToggle(${k.id})"><span class="slider"></span></label>
            </td>
          </tr>`).join('')
          :`<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:32px">Kupon bulunamadı</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`);
}
async function kuponKaydet(){
  const body={kod:(el('kp-kod').value||kuponGen()).toUpperCase(),indirim_tipi:el('kp-tip').value,indirim_degeri:parseFloat(el('kp-deger').value),kullanim_limiti:el('kp-limit').value?parseInt(el('kp-limit').value):null,gecerlilik_bitis:el('kp-bitis').value||null,aktif:el('kp-aktif').checked};
  if(isNaN(body.indirim_degeri)){showToast('İndirim değeri gerekli','err');return;}
  const r=await api('/paket-kuponlari',{method:'POST',body:JSON.stringify(body)});
  if(r&&r.hata){showToast(r.hata,'err');return;}
  showToast('Kupon oluşturuldu ✓');
  vKuponlar();
}
async function kuponToggle(id){ await api('/paket-kuponlari/'+id+'/toggle',{method:'PUT'}); showToast('Güncellendi ✓'); vKuponlar(); }

          <div>
            <p style="font-weight:700;color:#1a2e4a;font-size:14px">Çevrimiçi Durumu</p>
            <p style="font-size:13px;color:${online?'#15803d':'#94a3b8'};margin-top:2px">${online?'🟢 Şu an çevrimiçisiniz':'⚪ Çevrimdışı görünüyorsunuz'}</p>

async function waSave(){
  if(el('wa-tel')) _wa.telefon=el('wa-tel').value;
  if(el('wa-key')) _wa.api_key=el('wa-key').value;
  const r=await api('/whatsapp-ayar',{method:'PATCH',body:JSON.stringify(_wa)});
  showToast(r&&r.ok?'WhatsApp ayarları kaydedildi ✓':'Ayarlar kaydedildi');
}

// ═══════════════════════════════════════════════
// ENTEGRASYONLAR (Aufbau 1:1 nach Cankartım 04-sistem integrations/page.tsx)
// Karte je Anbieter: Modus, Zustand (Hazır/Doğrulanmış/Eksik/Devre Dışı),
// Pflichtfeld-Balken n/n, Detaylar, Yapılandır (Geheimfelder maskiert),
// Kaydet, Bağlantı Testi, Son Test. Masken werden nie zurueckgeschrieben.
// ═══════════════════════════════════════════════
let _ent={liste:[],offen:{},detay:{},duzenle:false,mail:'log',ortam:'staging',sifreleme:true};
const ENT_MOD={disabled:['Devre Dışı','gray'],fake:['Simülasyon','amber'],test:['Test','blue'],live:['Canlı','green']};
const ENT_HAZIR={disabled:['Devre Dışı','gray'],missing:['Eksik','red'],ready:['Hazır','blue'],verified:['Doğrulanmış','green']};
const ENT_KAYNAK={db:'DB',env:'.env',default:'Standart'};

async function vEntegrasyonlar(){
  Vloading();
  const d=await api('/entegrasyonlar').catch(()=>null);
  if(!d||!d.entegrasyonlar){ V(`<div class="card"><div class="card-body" style="text-align:center;color:#94a3b8;padding:48px">Entegrasyon verisi alınamadı</div></div>`); return; }
  _ent={..._ent,liste:d.entegrasyonlar,duzenle:d.duzenleyebilir,mail:d.mail_kanali,ortam:d.ortam,sifreleme:d.sifreleme};
  entRender();
}
function entRender(){
  const L=_ent.liste;
  const uyari=L.filter(x=>x.readiness.durum==='missing'||x.son_test_sonuc==='hata');
  V(`
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:46px;height:46px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:20px">🔌</div>
      <div><p style="font-size:20px;font-weight:800;color:#1a2e4a;line-height:1.2">Entegrasyon Operasyonları</p>
      <p style="font-size:13px;color:#64748b">Harici servis bağlantıları, yapılandırma ve test</p></div>
    </div>
    <button class="btn btn-secondary" onclick="vEntegrasyonlar()">⟳ Yenile</button>
  </div>
  ${!_ent.sifreleme?`<div class="card" style="border-color:#fecaca;background:#fef2f2;margin-bottom:14px"><div class="card-body" style="color:#b91c1c;font-size:13px;font-weight:600">INTEGRATION_ENCRYPTION_KEY eksik — gizli alanlar kaydedilemez.</div></div>`:''}
  <div class="card" style="margin-bottom:16px;${uyari.length?'border-color:#fde68a;background:#fffbeb':'border-color:#bbf7d0;background:#f0fdf4'}"><div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px">
    <div><p style="font-weight:700;color:${uyari.length?'#b45309':'#15803d'}">${uyari.length?'Uyarılar Mevcut':'Tüm entegrasyonlar sorunsuz'}</p>
    <p style="font-size:12.5px;color:#64748b;margin-top:2px">${uyari.length?uyari.length+' entegrasyon: '+uyari.map(x=>escH(x.ad)).join(', '):L.length+' entegrasyon'}
     · E-posta kanalı: <strong>${{resend:'Resend',smtp:'SMTP',log:'yalnız günlük (gönderim yok)'}[_ent.mail]||_ent.mail}</strong></p></div>
    <span class="badge ${uyari.length?'amber':'green'}">${uyari.length?'⚠ Uyarı':'✓ OK'}</span>
  </div></div>
  ${!_ent.duzenle?`<p style="font-size:12.5px;color:#64748b;margin-bottom:12px">Yalnız görüntüleme: kaydetme ve test süper admin yetkisi ister.</p>`:''}
  <div class="ent-grid">${L.map(entKarte).join('')}</div>`);
  L.forEach(x=>{ if(_ent.offen[x.key]) entModelleriLaden(x); });
}
function entKarte(x){
  const [mAd,mRenk]=ENT_MOD[x.mod]||[x.mod,'gray'];
  const [hAd,hRenk]=ENT_HAZIR[x.readiness.durum]||[x.readiness.durum,'gray'];
  const r=x.readiness; const pct=r.toplam?Math.round(r.mevcut/r.toplam*100):100;
  const barRenk=pct===100?'#22c55e':pct>50?'#eab308':pct>0?'#f97316':'#ef4444';
  const testBadge=x.son_test_sonuc==='ok'?'<span class="badge green">✓ OK</span>':x.son_test_sonuc==='hata'?'<span class="badge red">✕ Hata</span>':'';
  const kopfFarbe={verified:'#f0fdf4',ready:'#eff6ff',missing:'#fef2f2',disabled:'#f8fafc'}[r.durum];
  return `<div class="card ent-karte" id="ent-${x.key}">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;background:${kopfFarbe}">
      <div style="display:flex;gap:12px;min-width:0">
        <div style="width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${x.ikon}</div>
        <div style="min-width:0"><p style="font-weight:700;color:#1a2e4a">${escH(x.ad)}${x.hazirlik?' <span class="badge gray" style="font-size:10px">hazırlanıyor</span>':''}</p>
        <p style="font-size:12px;color:#64748b">${escH(x.aciklama)}</p></div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end"><span class="badge ${mRenk}">${mAd}</span>${testBadge}</div>
    </div>
    <div style="padding:12px 16px 4px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge ${hRenk}"><span class="dot ${hRenk}"></span>${hAd}</span><code style="font-size:11.5px;color:#94a3b8">${x.mod}</code></div>
      <p style="font-size:13.5px;color:#334155;margin:8px 0">${escH(r.ozet)}</p>
      <div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${barRenk}"></div></div><code style="font-size:11.5px;color:#64748b">${r.mevcut}/${r.toplam}</code></div>
      ${r.eksik.length?`<p style="font-size:12px;color:#b91c1c;font-weight:600;margin-top:8px">✕ Eksik Alanlar</p><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${r.eksik.map(e=>`<code style="font-size:11px;background:#fef2f2;color:#b91c1c;padding:2px 6px;border-radius:5px">${escH(e)}</code>`).join('')}</div>`
        :`<p style="font-size:12px;color:#15803d;margin-top:8px">✓ Eksik alan yok</p>`}
      <button class="ent-link" onclick="entDetay('${x.key}')">${_ent.detay[x.key]?'▾':'▸'} Detaylar</button>
      ${_ent.detay[x.key]?`<div style="font-size:12px;color:#475569;background:#f8fafc;border-radius:9px;padding:10px 12px;margin-bottom:8px;line-height:1.8">
        ${x.alanlar.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${escH(a.label)}${a.zorunlu?' *':''}</span><span>${a.dolu?'✓':'—'} <code style="color:#94a3b8">${a.kaynak?ENT_KAYNAK[a.kaynak]:'yok'}</code></span></div>`).join('')}
        <div style="display:flex;justify-content:space-between"><span>Mod kaynağı</span><code style="color:#94a3b8">${x.modKaynak==='db'?'DB':'Standart'}</code></div>
        ${x.guncellendi_at?`<div style="display:flex;justify-content:space-between"><span>Son değişiklik</span><span>${fmtDateTime(x.guncellendi_at)}${x.guncelleyen?' · '+escH(x.guncelleyen):''}</span></div>`:''}
        ${x.turnstileTest?'<div style="color:#1d4ed8">Test modu: Cloudflare’in resmi test anahtarları kullanılır (her zaman geçer).</div>':''}
      </div>`:''}
    </div>
    <div style="border-top:1px solid #f1f5f9">
      <button class="ent-link" style="width:100%;justify-content:space-between;padding:10px 16px;margin:0" onclick="entAc('${x.key}')"><span>⚙ Yapılandır</span><span>${_ent.offen[x.key]?'▴':'▾'}</span></button>
      ${_ent.offen[x.key]?entForm(x):''}
    </div>
  </div>`;
}
function entForm(x){
  const dis=_ent.duzenle?'':'disabled';
  const kaynaklar=[...new Set(x.alanlar.filter(a=>a.kaynak).map(a=>ENT_KAYNAK[a.kaynak]))];
  return `<div style="padding:4px 16px 16px">
    <p style="font-size:12px;color:#64748b;margin-bottom:12px">ⓘ Gizli alanlar maskelenmiştir · Kaynak: ${kaynaklar.length?'('+kaynaklar.join(', ')+')':'—'}</p>
    <label>Çalışma Modu</label>
    <select id="ent-${x.key}-mod" ${dis} style="margin-bottom:12px">${x.modlar.map(m=>`<option value="${m}" ${m===x.mod?'selected':''}>${(ENT_MOD[m]||[m])[0]}</option>`).join('')}</select>
    ${x.alanlar.map(a=>{
      const id=`ent-${x.key}-${a.key}`;
      let feld;
      if(a.envSadece) feld=`<input id="${id}" value="${escH(a.dolu?a.deger:'')}" placeholder="tanımlı değil" disabled/><p style="font-size:11.5px;color:#94a3b8;margin-top:3px">Anahtar /etc/kapbeni.env içinde kalır${a.env?' ('+a.env+')':''}; buradan değiştirilemez.</p>`;
      else if(a.tip==='textarea') feld=`<textarea id="${id}" rows="3" ${dis} placeholder="${escH(a.placeholder)}">${escH(a.deger||'')}</textarea>`;
      else if(a.tip==='select') feld=`<select id="${id}" ${dis}>${[...new Set([a.deger,...(a.secenekler||[])].filter(Boolean))].map(v=>`<option value="${escH(v)}" ${v===a.deger?'selected':''}>${escH(v)}</option>`).join('')}</select>`;
      else if(a.secret) feld=`<input id="${id}" type="password" autocomplete="new-password" ${dis} value="" placeholder="${escH(a.dolu?a.deger+' (değiştirmek için yazın)':'tanımlı değil')}"/>`;
      else feld=`<input id="${id}" ${dis} value="${escH(a.kaynak==='db'?a.deger:'')}" placeholder="${escH(a.kaynak&&a.kaynak!=='db'?a.deger+' ('+ENT_KAYNAK[a.kaynak]+')':a.placeholder)}"/>`;
      return `<div style="margin-bottom:12px"><label>${escH(a.label)}${a.zorunlu?' <span style="color:#e53935">*</span>':''} <span style="font-weight:500;color:#94a3b8">${a.kaynak?'· '+ENT_KAYNAK[a.kaynak]:''}</span></label>${feld}</div>`;
    }).join('')}
    ${x.son_test_at?`<div style="font-size:12px;border-radius:9px;padding:9px 12px;margin-bottom:12px;background:${x.son_test_sonuc==='ok'?'#f0fdf4;color:#15803d':'#fef2f2;color:#b91c1c'}">🕒 <strong>Son Test:</strong> ${x.son_test_sonuc==='ok'?'PASS':'FAIL'} — ${escH(x.son_test_mesaj||'')} <span style="color:#94a3b8">(${fmtDateTime(x.son_test_at)})</span></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-blue" ${dis} onclick="entKaydet('${x.key}')">💾 Kaydet</button>
      <button class="btn btn-secondary" ${dis} onclick="entTest('${x.key}',this)">⚡ Bağlantı Testi</button>
    </div>
  </div>`;
}
function entDetay(k){ _ent.detay[k]=!_ent.detay[k]; entRender(); }
function entAc(k){ _ent.offen[k]=!_ent.offen[k]; entRender(); }
const _entModeller={};
async function entModelleriLaden(x){
  const a=x.alanlar.find(f=>f.dinamik==='claude-modeller'); if(!a) return;
  if(!_entModeller.claude){ try{ _entModeller.claude=await api('/entegrasyonlar/claude/modeller'); }catch{ _entModeller.claude=[]; } }
  const sel=el(`ent-${x.key}-${a.key}`); if(!sel||!Array.isArray(_entModeller.claude)) return;
  const ids=[...new Set([a.deger,..._entModeller.claude.map(m=>m.id)].filter(Boolean))];
  sel.innerHTML=ids.map(v=>`<option value="${escH(v)}" ${v===a.deger?'selected':''}>${escH(v)}</option>`).join('');
}
async function entKaydet(k){
  const x=_ent.liste.find(i=>i.key===k); if(!x) return;
  const degerler={};
  x.alanlar.forEach(a=>{ if(a.envSadece) return; const f=el(`ent-${k}-${a.key}`); if(!f) return;
    const v=f.value.trim();
    // Geheimfeld leer = unveraendert; Maskenwerte werden nie zurueckgeschrieben.
    if(a.secret){ if(v&&!v.startsWith('••••')) degerler[a.key]=v; }
    else degerler[a.key]=v; });
  const mod=el(`ent-${k}-mod`)?.value;
  const r=await fetch(API+'/entegrasyonlar/'+k,{method:'POST',headers:H(),body:JSON.stringify({mod,degerler})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){ showToast(d.hata||'Kaydedilemedi','err'); return; }
  const i=_ent.liste.findIndex(e=>e.key===k); if(i>=0&&d.entegrasyon) _ent.liste[i]=d.entegrasyon;
  showToast(x.ad+' kaydedildi ✓'); entRender();
}
async function entTest(k,btn){
  if(btn){btn.disabled=true;btn.textContent='Test ediliyor…';}
  const r=await fetch(API+'/entegrasyonlar/'+k+'/test',{method:'POST',headers:H()});
  const d=await r.json().catch(()=>({}));
  showToast((d.ok?'✓ ':'✕ ')+(d.mesaj||d.hata||'Test başarısız'),d.ok?'ok':'err');
  await vEntegrasyonlar(); _ent.offen[k]=true; entRender();
}
